<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三友ワークス｜三友製作所 ものづくり体験ゲーム</title>
<meta name="description" content="茨城県のものづくり企業・三友製作所の仕事を体験できるシミュレーションゲーム。新人として、マスコットの「さんぽぽ」を1つ、設計開発・機械加工・組立調整の3つの部門で、設計から出荷まで作り上げます。">
<meta name="theme-color" content="#080c12">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="三友ワークス">
<meta property="og:title" content="三友ワークス｜三友製作所 ものづくり体験ゲーム">
<meta property="og:description" content="新人として、さんぽぽを設計から出荷まで作ろう。約10分で遊べる仕事体験ゲーム。">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" sizes="64x64" href="img/icon-64.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css?v=2.9.5">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hb-l"><span id="hudClock">AM 08:25</span><span id="hudPlace">三友製作所</span><ol id="steps" hidden aria-label="いまの部門"></ol></div>
    <div id="tag" aria-live="polite"></div>
    <div class="hb-r">
      <span id="hudTimer" hidden></span><span id="hudScore">★ 0 / 24</span>
      <button type="button" class="hbtn" id="btnSound" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="on-w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off-x" d="M17 9.5l5 5M22 9.5l-5 5"/></svg></button>
      <button type="button" class="hbtn" id="btnHelp" aria-label="この現場の操作を見る" title="この現場の操作を見る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4.5 2.6c-.9.6-1.5 1.2-1.5 2.4"/><path d="M12 18h.01"/></svg></button>
      <button type="button" class="hbtn" id="btnPause" aria-label="一時停止" title="一時停止（Esc）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
      <button type="button" class="hbtn" id="btnFull" aria-label="全画面表示の切りかえ" title="全画面表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>
  <main class="stagewrap" id="stagewrap">
    <div class="screen" id="screen">
      <canvas id="cv" width="640" height="360" aria-label="ゲーム画面"></canvas>
      <div class="vig" aria-hidden="true"></div>
      <div class="flash" id="flash" hidden></div>
      <div class="toast" id="toast" hidden><img src="img/sanpopo.png" alt=""><p id="toastText"></p></div>
      <div class="tut" id="tut" hidden></div>
      <div class="dialog" id="dialog" hidden role="button" tabindex="0" aria-label="会話を進める">
        <img id="face" src="img/sanpopo.png" alt="">
        <div class="dlg-body"><p id="who">さんぽぽ <span id="dlgCount"></span></p><p id="line"></p></div>
        <button type="button" class="dlg-skip" id="dlgSkip">スキップ ≫</button>
        <span class="next" aria-hidden="true">▼</span>
      </div>
      <div class="panel" id="panel" hidden></div>
      <div class="stcard" id="card" hidden></div>
      <div class="idle" id="idle" hidden><div><p class="big">しばらく操作がありません</p><p>あと</p><b id="idleN">20</b><p>秒でタイトルにもどります。<br>画面にさわると、このままつづけられます。</p></div></div>
      <div class="fade" id="fade" hidden></div>
    </div>
  </main>
  <footer class="console">
    <p class="hint" id="hint"></p>
    <div class="ctrls" id="ctrls"></div>
  </footer>
</div>
<div class="rotate" aria-hidden="true"><div>
  <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  <p>スマートフォンを横向きにしてください<small>このゲームは横長の画面で遊びます</small></p></div></div>
<noscript><p style="padding:2em;color:#fff">このゲームを遊ぶには、ブラウザの JavaScript を有効にしてください。</p></noscript>
<script src="js/assets.js?v=2.9.5"></script>
<script src="js/core.js?v=2.9.5"></script>
<script src="js/gl3d.js?v=2.9.5"></script>
<script src="js/model.js?v=2.9.5"></script>
<script src="js/data.js?v=2.9.5"></script>
<script src="js/staff.js?v=2.9.5"></script>
<script src="js/survey.js?v=2.9.5"></script>
<script src="js/tutorial.js?v=2.9.5"></script>
<script src="js/tasks/common.js?v=2.9.5"></script>
<script src="js/tasks/metal.js?v=2.9.5"></script>
<script src="js/tasks/cad.js?v=2.9.5"></script>
<script src="js/tasks/dev.js?v=2.9.5"></script>
<script src="js/tasks/mc.js?v=2.9.5"></script>
<script src="js/tasks/asm.js?v=2.9.5"></script>
<script src="js/screens.js?v=2.9.5"></script>
<script src="js/main.js?v=2.9.5"></script>
</body>
</html>
